name: Build Demo

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  executable:
    name: Build executable
    runs-on: ubuntu-latest
    container: ubuntu:rolling
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute build metadata
        id: meta
        run: |
          echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git golang gcc pkg-config libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav
      - name: Check GStreamer version
        run: |
          pkg-config --modversion gstreamer-1.0
          pkg-config --modversion gstreamer-base-1.0
      - name: Test
        run: go test ./...
      - name: Build
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
          BUILD_DATE: ${{ steps.meta.outputs.date }}
        run: |
          mkdir -p dist
          CGO_ENABLED=1 go build \
            -ldflags "-X main.version=${VERSION} -X main.commit=${COMMIT} -X main.buildDate=${BUILD_DATE}" \
            -o dist/stream-demo ./cmd/stream-demo
          dist/stream-demo version
      - uses: actions/upload-artifact@v4
        with:
          name: stream-demo-linux-amd64
          path: dist/stream-demo

  image:
    name: Build container image
    runs-on: ubuntu-latest
    needs: executable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute build metadata
        id: meta
        run: |
          echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: stream-things-demo:release
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify image version
        run: docker run --rm --entrypoint stream-demo stream-things-demo:release version
      - name: Export image archive
        run: docker save stream-things-demo:release | gzip -9 > /tmp/stream-things-demo-image.tar.gz
      - name: Upload image archive
        uses: actions/upload-artifact@v4
        with:
          name: stream-things-demo-image
          path: /tmp/stream-things-demo-image.tar.gz

  release:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs: [executable, image]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download executable
        uses: actions/download-artifact@v4
        with:
          name: stream-demo-linux-amd64
          path: assets/executable
      - name: Download image archive
        uses: actions/download-artifact@v4
        with:
          name: stream-things-demo-image
          path: assets/image
      - name: Collect assets
        run: |
          mkdir -p dist
          install -m 0755 assets/executable/stream-demo dist/stream-demo-linux-amd64
          mv assets/image/stream-things-demo-image.tar.gz dist/stream-things-demo-image.tar.gz
          cd dist
          sha256sum stream-demo-linux-amd64 stream-things-demo-image.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            dist/stream-demo-linux-amd64 \
            dist/stream-things-demo-image.tar.gz \
            dist/SHA256SUMS

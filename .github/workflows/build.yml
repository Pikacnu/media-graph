name: Build Demo

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  executable:
    name: Build executable
    runs-on: ubuntu-latest
    container: ubuntu:rolling
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git golang gcc pkg-config libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Check GStreamer version
        run: |
          pkg-config --modversion gstreamer-1.0
          pkg-config --modversion gstreamer-base-1.0
      - name: Test
        run: go test ./...
      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=1 go build -o dist/stream-demo ./cmd/stream-demo
      - uses: actions/upload-artifact@v4
        with:
          name: stream-demo-linux-amd64
          path: dist/stream-demo

  image:
    name: Build container image
    runs-on: ubuntu-latest
    needs: executable
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: stream-things-demo:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: Build Demo

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  executable:
    name: Build executable
    runs-on: ubuntu-latest
    container: ubuntu:rolling
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git golang gcc pkg-config libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav
      - name: Compute build metadata
        id: meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          short="$(printf '%s' "$SHA" | cut -c1-7)"
          if [ "$REF_TYPE" = "tag" ]; then
            version="$REF_NAME"
          else
            version="$short"
          fi
          if [ -z "$version" ] || [ -z "$short" ]; then
            echo "could not resolve build metadata" >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "commit=$short"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          echo "building $version ($short)"
      - name: Check GStreamer version
        run: |
          pkg-config --modversion gstreamer-1.0
          pkg-config --modversion gstreamer-base-1.0
      - name: Test
        run: go test ./...
      - name: Build
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
          BUILD_DATE: ${{ steps.meta.outputs.date }}
        run: |
          mkdir -p dist
          CGO_ENABLED=1 go build \
            -ldflags "-X main.version=${VERSION} -X main.commit=${COMMIT} -X main.buildDate=${BUILD_DATE}" \
            -o dist/stream-demo ./cmd/stream-demo
          built="$(dist/stream-demo version)"
          echo "$built"
          case "$GITHUB_REF" in
            refs/tags/*)
              case "$built" in
                "stream-demo ${GITHUB_REF_NAME} "*) ;;
                *) echo "built binary does not report ${GITHUB_REF_NAME}" >&2; exit 1 ;;
              esac ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: stream-demo-linux-amd64
          path: dist/stream-demo

  image:
    name: Build container image
    runs-on: ubuntu-latest
    needs: executable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute build metadata
        id: meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          short="$(printf '%s' "$SHA" | cut -c1-7)"
          if [ "$REF_TYPE" = "tag" ]; then
            version="$REF_NAME"
          else
            version="$short"
          fi
          if [ -z "$version" ] || [ -z "$short" ]; then
            echo "could not resolve build metadata" >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "commit=$short"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          echo "building $version ($short)"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: stream-things-demo:release
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify image version
        run: |
          built="$(docker run --rm --entrypoint stream-demo stream-things-demo:release version)"
          echo "$built"
          case "$GITHUB_REF" in
            refs/tags/*)
              case "$built" in
                "stream-demo ${GITHUB_REF_NAME} "*) ;;
                *) echo "image does not report ${GITHUB_REF_NAME}" >&2; exit 1 ;;
              esac ;;
          esac
      - name: Export image archive
        run: docker save stream-things-demo:release | gzip -9 > /tmp/stream-things-demo-image.tar.gz
      - name: Upload image archive
        uses: actions/upload-artifact@v4
        with:
          name: stream-things-demo-image
          path: /tmp/stream-things-demo-image.tar.gz

  release:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs: [executable, image]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download executable
        uses: actions/download-artifact@v4
        with:
          name: stream-demo-linux-amd64
          path: assets/executable
      - name: Download image archive
        uses: actions/download-artifact@v4
        with:
          name: stream-things-demo-image
          path: assets/image
      - name: Collect assets
        run: |
          mkdir -p dist
          install -m 0755 assets/executable/stream-demo dist/stream-demo-linux-amd64
          mv assets/image/stream-things-demo-image.tar.gz dist/stream-things-demo-image.tar.gz
          cd dist
          sha256sum stream-demo-linux-amd64 stream-things-demo-image.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Verify release metadata
        run: |
          grep -E "^[0-9a-f]{64}  stream-demo-linux-amd64$" dist/SHA256SUMS
          grep -E "^[0-9a-f]{64}  stream-things-demo-image.tar.gz$" dist/SHA256SUMS
      - name: Remove stale and draft releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${TAG}" ]; then
            echo "ref_name is empty; refusing to manage an untagged release" >&2
            exit 1
          fi
          echo "cleaning releases for ${TAG}"
          ids="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate \
            --jq ".[] | select(.draft == true or .tag_name == \"${TAG}\") | .id")"
          for id in ${ids}; do
            echo "deleting release ${id}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}" >/dev/null
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${TAG}" ]; then
            echo "ref_name is empty; refusing to create an untagged release" >&2
            exit 1
          fi
          echo "publishing release for tag ${TAG}"
          jq -n --arg tag "${TAG}" --rawfile body RELEASE_NOTES.md \
            '{tag_name: $tag, name: $tag, body: $body, draft: false, prerelease: false, make_latest: "true"}' \
            > /tmp/release.json
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
            --input /tmp/release.json >/dev/null
          gh release upload "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber \
            dist/stream-demo-linux-amd64 \
            dist/stream-things-demo-image.tar.gz \
            dist/SHA256SUMS
      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          info="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json tagName,isDraft,assets)"
          echo "$info"
          echo "$info" | jq -e --arg tag "${TAG}" '.tagName == $tag and .isDraft == false' >/dev/null
          echo "$info" | jq -e '[.assets[].name] | sort ==
            ["SHA256SUMS","stream-demo-linux-amd64","stream-things-demo-image.tar.gz"]' >/dev/null
